# Copy into a product repo as .github/workflows/docs-surface-lint.yml
# after GromCodebase ADR-0025 is on the default branch the `ref` points at.

name: docs-surface-lint

on:
  pull_request:
    paths:
      - "docs/next-session.md"
      - "docs/groundwork.md"
      - "docs/ROADMAP.md"
      - "docs/WORK-FRONTLOG.md"
      - "docs/decisions/**"
      - "README.md"
      - "AGENTS.md"
      - "NEXT-SESSION.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: shapeslines/GromCodebase
          path: .gcb-docs-lint
          sparse-checkout: |
            tools/docs-surface-lint.py
            tools/next-session-audit.py
            tools/layout_registry.py
            docs/fleet/docs-surface-allowlist.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: lint this checkout (shape only)
        run: python .gcb-docs-lint/tools/docs-surface-lint.py --repo . --require-presence --allowlist .gcb-docs-lint/docs/fleet/docs-surface-allowlist.json
