name: ci

# Mirror the local pre-push gate in the cloud: a /WX build + ctest on Windows/MSVC,
# now over the real Vulkan backend (G15: the SDK is installed on the runner and
# MOBA_VULKAN_REQUIRED=ON) across Debug, RelWithDebInfo (the "build you play"), and
# Release — so the determinism golden is exercised over the full
# {/fp:precise, /fp:fast} x {Debug, Release} matrix (ADR-0002) plus the play config
# (G16). The null backend stays always-built for the headless suites; the sandbox
# validation run additionally exercises the real renderer when the runner has a
# Vulkan 1.3 device (and skips cleanly when it does not — device gating is the
# renderer's own ADR-0012 check).
on:
  push:
    branches: [main]
  pull_request:

# Newer pushes to a PR supersede in-flight runs for the same ref. NEVER cancel a
# main-branch run, though — each commit on main should get a completed CI result
# (a cancelled run is neither green nor a usable baseline).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  windows-msvc:
    name: windows-msvc (${{ matrix.config }})
    runs-on: windows-latest
    strategy:
      fail-fast: false          # want every config's signal, not just the first failure
      matrix:
        config: [Debug, RelWithDebInfo, Release]
    steps:
      - uses: actions/checkout@v5

      # Vulkan SDK (G15): pinned 1.4.357.0 per README/CMakeLists. The build below
      # hard-requires it (-DMOBA_VULKAN_REQUIRED=ON) so the real backend, the
      # offline shader builds, and the validation-layer run are always gated.
      - name: Install LunarG Vulkan SDK (pinned 1.4.357.0)
        shell: pwsh
        run: |
          winget install --id KhronosGroup.VulkanSDK --version 1.4.357.0 --silent --accept-package-agreements --accept-source-agreements
          $sdk = "C:\VulkanSDK\1.4.357.0"                       # winget default install root
          if (-not (Test-Path $sdk)) { $sdk = Join-Path ${env:ProgramFiles} "VulkanSDK\1.4.357.0" }
          if (-not (Test-Path $sdk)) { Write-Error "SDK not at C:\VulkanSDK\1.4.357.0 or Program Files after winget install"; exit 1 }
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          "PATH=$sdk\bin;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

      # MSVC is set up WITHOUT a third-party Node action: ilammy/msvc-dev-cmd has no
      # Node 24 release and GitHub is retiring Node 20 actions, so instead we discover
      # the VS install with vswhere and source vcvars64 in-line. This is Node-free and
      # robust across the windows-latest VS2022 -> VS2026 image migration, and mirrors
      # the local tools/hooks/ctest-gate.bat. One combined step because the vcvars env
      # does not persist across separate run: steps. `|| exit /b 1` propagates early
      # failures (cmd does not stop on error by default); the final ctest decides the job.
      - name: Build + test (${{ matrix.config }})
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VSPATH=%%i"
          if not defined VSPATH ( echo No Visual Studio install found & exit /b 1 )
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cmake --version || exit /b 1
          ninja --version || exit /b 1
          cmake --preset ci -DMOBA_VULKAN_REQUIRED=ON || exit /b 1
          cmake --build build-ci --config ${{ matrix.config }} || exit /b 1
          ctest --test-dir build-ci -C ${{ matrix.config }} --output-on-failure --no-tests=error --output-junit "%CD%\ctest-${{ matrix.config }}.xml"

      # The runnable DoD, in the cloud: 90 frames with validation on, screenshot
      # written. A runner with no compatible Vulkan driver/device may skip only when
      # the renderer emits one of its explicit device-gate diagnostics. Every other
      # instance/device initialization failure stays red. A validation-layer ERROR
      # aborts the sandbox, so "validation-clean" is enforced by the exit code, not
      # observed by hand. cmd redirection + unconditional echo avoids pwsh's native
      # redirect/ErrorActionPreference interaction swallowing the failure log.
      - name: Sandbox validation run (${{ matrix.config }})
        shell: pwsh
        run: |
          $log = "sandbox-${{ matrix.config }}.log"
          Write-Output "RUNNING sandbox (${{ matrix.config }})..."
          cmd /c "build-ci\tools\sandbox\${{ matrix.config }}\sandbox.exe --frames 90 --screenshot out-${{ matrix.config }}.bmp > `"$log`" 2>&1"
          $code = $LASTEXITCODE
          Write-Output "sandbox exited $code"
          if (Test-Path $log) { Get-Content $log }
          $screenshot = "out-${{ matrix.config }}.bmp"
          $classifierArgs = @("-NoProfile", "-ExecutionPolicy", "Bypass", "-File", ".\tools\classify-sandbox-smoke.ps1",
                              "-LogPath", $log, "-ScreenshotPath", $screenshot,
                              "-ProcessExitCode", $code)
          $classification = @(& powershell.exe @classifierArgs 2>&1 | ForEach-Object { "$_" })
          $classifierCode = $LASTEXITCODE
          $classification | Write-Output
          if ($classifierCode -ne 0) {
            "sandbox FAILED — strict classifier rejected the log/exit/screenshot tuple; log above" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            exit $classifierCode
          }
          if ($classification -contains "SANDBOX_SMOKE=SKIP") {
            "SKIP: no Vulkan driver/1.3 device on this runner — real renderer compiled but not executed." | Out-File -Append $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          "sandbox: 90 validation-clean frames; screenshot written." | Out-File -Append $env:GITHUB_STEP_SUMMARY

      # Render the per-test results into the GitHub run summary (native — no third-party
      # action, consistent with the Node-free setup). Reads the JUnit XML ctest wrote;
      # always() so a red run still reports. On an [xml] element $c.name is the TAG name,
      # so attributes are read via GetAttribute.
      - name: Test report (${{ matrix.config }})
        if: always()
        shell: pwsh
        run: |
          $xml = "ctest-${{ matrix.config }}.xml"
          $sum = $env:GITHUB_STEP_SUMMARY
          if (-not (Test-Path $xml)) { "No JUnit XML produced ($xml)." | Out-File -Append $sum; exit 0 }
          [xml]$doc = Get-Content $xml
          $cases = @($doc.SelectNodes('//testcase'))
          $fails = @($cases | Where-Object { $_.GetAttribute('status') -eq 'fail' -or $_.SelectSingleNode('failure') })
          $lines = @()
          $lines += "## Tests - ${{ matrix.config }}"
          $lines += ""
          $lines += "**$($cases.Count) tests, $($fails.Count) failed.**"
          $lines += ""
          $lines += "| Test | Result | Time (s) |"
          $lines += "|------|--------|----------|"
          foreach ($c in $cases) {
            $bad = ($c.GetAttribute('status') -eq 'fail') -or ($null -ne $c.SelectSingleNode('failure'))
            $icon = if ($bad) { ':x:' } else { ':white_check_mark:' }
            $lines += "| $($c.GetAttribute('name')) | $icon | $($c.GetAttribute('time')) |"
          }
          ($lines -join "`n") | Out-File -Append $sum

  # M3.4 stretch gate: use an installed clang-cl, prove the
  # UBSan runtime with a real overflow tripwire, then run the instrumented oracle.
  # A runner without the optional LLVM component reports UNAVAILABLE explicitly.
  # A present compiler always runs the oracle; UBSan runs after its capability probe.
  windows-clang-cl-stretch:
    name: windows-clang-cl (UBSan capability)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Probe clang-cl + UBSan and run the determinism oracle
        shell: pwsh
        run: ./tools/check-clang-cl-determinism.ps1

  # G36: the FIXES.md "stranger's walk", scripted — a fresh clone taken through the
  # documented README path. This is the repeatable replacement for the manual sweep.
  fresh-walk:
    name: fresh-walk (stranger's path)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install LunarG Vulkan SDK (pinned 1.4.357.0)
        shell: pwsh
        run: |
          winget install --id KhronosGroup.VulkanSDK --version 1.4.357.0 --silent --accept-package-agreements --accept-source-agreements
          $sdk = "C:\VulkanSDK\1.4.357.0"                       # winget default install root
          if (-not (Test-Path $sdk)) { $sdk = Join-Path ${env:ProgramFiles} "VulkanSDK\1.4.357.0" }
          if (-not (Test-Path $sdk)) { Write-Error "SDK not at C:\VulkanSDK\1.4.357.0 or Program Files after winget install"; exit 1 }
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          "PATH=$sdk\bin;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
      - name: Run the fresh-checkout walk
        shell: pwsh
        run: ./tools/fresh-walk.ps1
