name: fleet-m5-strict-clang-proof
on:
  push:
    branches: [codex/fleet-m5-asan-c9533bd-20261116]
permissions:
  contents: read
jobs:
  windows-clang:
    name: M5 exact-source strict clang and UBSan
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: c9533bd4e6810b9150d76ad0491e92282ca1a67b
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source revision
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne 'c9533bd4e6810b9150d76ad0491e92282ca1a67b') { throw "Unexpected source revision $head" }
          if (git status --porcelain) { throw 'Source checkout is dirty' }
          Write-Output "SOURCE_HEAD=$head"
      - name: Require clang-cl and UBSan
        shell: pwsh
        run: ./tools/check-clang-cl-determinism.ps1 -RequireCompiler -RequireUbsan
